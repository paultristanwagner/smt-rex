name: Release

# A tag smt-rex-vX.Y.Z builds the binaries and attaches them to a draft release, which is
# published by hand.
on:
  push:
    tags: ["smt-rex-v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          # glibc 2.35: runs on current distributions; musl's allocator would cost speed.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - run: cargo test --release --all
      - run: cargo build --release --bin smt-rex --target ${{ matrix.target }}
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="smt-rex-${TAG#smt-rex-v}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/smt-rex" "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: smt-rex-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "SMT-Rex ${TAG#smt-rex-v}" --notes "Binaries for SMT-Rex ${TAG#smt-rex-v}."
